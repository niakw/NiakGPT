version: 2

# Keep routine dependency maintenance intentionally low-noise.
# Security alerts / security updates remain controlled by Advanced Security and
# are not disabled by these monthly version-update limits.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "05:00"
      timezone: "Europe/Paris"

    # Dependabot understands full-SHA pinned Actions and updates immutable refs.
    # Keep one grouped maintenance PR instead of PR spam.
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      github-actions-version-updates:
        patterns:
          - "*"

    commit-message:
      prefix: "deps(actions)"

  # NiakGPT has no root package.json. The maintained npm project lives here.
  - package-ecosystem: "npm"
    directory: "/visual-lab"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Paris"

    # visual-lab/package.json pins the Playwright version exactly; update the
    # manifest and lockfile together and keep routine npm updates grouped.
    versioning-strategy: "increase"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    groups:
      npm-version-updates:
        patterns:
          - "*"

    commit-message:
      prefix: "deps(npm)"

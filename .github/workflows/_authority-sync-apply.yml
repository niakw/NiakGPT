name: Temporary Authority Sync Apply
on:
  push:
    branches: [fix/codeql-live-ui-regressions]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Apply synchronous Projects authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codeql-live-ui-regressions
          fetch-depth: 0
      - run: python .github/fix-authority-sync.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply synchronous Projects authority"
          git push origin HEAD:fix/codeql-live-ui-regressions

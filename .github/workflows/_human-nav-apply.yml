name: Temporary Human Nav Apply

on:
  push:
    branches:
      - fix/codeql-live-ui-regressions

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply human navigation hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codeql-live-ui-regressions
          fetch-depth: 0
      - name: Apply hardening
        run: python .github/apply-human-nav-v114.py
      - name: Commit runtime and labs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply human navigation hardening"
          git push origin HEAD:fix/codeql-live-ui-regressions

name: NiakGPT Action Menu Remount v130

on:
  pull_request:
    paths:
      - 'sidebar-actions-v123.js'
      - 'visual-lab/tests/action-menu-remount-toggle-v130.spec.js'
      - '.github/workflows/action-menu-remount-v130.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakgpt-action-menu-remount-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Action menu semantic toggle · Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - name: Install lab dependencies
        working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - name: Action menu trigger-remount regression
        working-directory: visual-lab
        run: npx playwright test tests/action-menu-remount-toggle-v130.spec.js --workers=1 --reporter=line

name: Apply NiakGPT 0.9.70 migration

on:
  pull_request:
    paths:
      - 'tools/apply-0970.mjs'
      - '.github/workflows/apply-0970.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize migration marker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sidebar-projects-v121.js')
          s=p.read_text()
          old="if(window.navigation?.addEventListener)window.navigation.addEventListener('navigatesuccess',()=>schedule(0));window.addEventListener('pageshow'"
          new="if(window.navigation?.addEventListener)window.navigation.addEventListener('navigatesuccess',()=>schedule(0));\n  window.addEventListener('pageshow'"
          if old not in s:
              raise SystemExit('migration marker normalization missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply migration
        run: node tools/apply-0970.mjs
      - name: Remove one-shot migration files
        run: rm -f tools/apply-0970.mjs .github/workflows/apply-0970.yml
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "NiakGPT 0.9.70: stabilize sidebar UX runtime"
          git push origin HEAD:${{ github.head_ref }}

name: Apply NiakGPT API robustness 0.9.6

on:
  push:
    branches: [main]
    paths:
      - 'tools/api-robustness-v096.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/api-robustness-v096.mjs
      - run: node --check app-v090.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v090.js tools/check-runtime.mjs
          git commit -m "Harden NiakGPT Project pagination shapes"
          git pull --rebase origin main
          git push origin HEAD:main

name: Apply NiakGPT diagnostic bus 0.9.6

on:
  push:
    branches: [main]
    paths:
      - 'tools/diagnostic-bus-v096.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/diagnostic-bus-v096.mjs
      - run: |
          node --check diagnostic-bus-v096.js
          node --check app-v090.js
          node --check coach-v100.js
          node --check multitab-v090.js
          node --check hotcache-v084.js
          node --check project-pins-v090.js
          node --check project-governance-v090.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json app-v090.js coach-v100.js multitab-v090.js hotcache-v084.js project-pins-v090.js project-governance-v090.js tools/check-runtime.mjs
          git commit -m "Centralize NiakGPT diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main

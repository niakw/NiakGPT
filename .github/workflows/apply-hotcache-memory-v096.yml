name: Apply NiakGPT hot-cache memory 0.9.6

on:
  push:
    branches: [main]
    paths:
      - 'tools/hotcache-memory-v096.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply memory bound
        run: node tools/hotcache-memory-v096.mjs
      - name: Validate
        run: |
          node --check hotcache-main-v084.js
          grep -Fq 'MAX_MEMORY_BYTES = 48 * 1024 * 1024' hotcache-main-v084.js
          grep -Fq 'const head = text.slice(0, 128 * 1024)' hotcache-main-v084.js
          ! grep -Fq 'while ((match = timeRx.exec(text)))' hotcache-main-v084.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hotcache-main-v084.js tools/check-hotpath-v096.mjs
          git commit -m "Bound NiakGPT hot-cache memory"
          git pull --rebase origin main
          git push origin HEAD:main

name: Apply NiakGPT heavy-thread scan 0.9.6

on:
  push:
    branches: [main]
    paths:
      - 'tools/initial-scan-v096.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niakgpt-initial-scan-v096
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply chunked initial scan only
        run: node tools/initial-scan-v096.mjs
      - name: Validate chunking and syntax
        run: |
          node --check app-v090.js
          grep -Fq 'const end=Math.min(index+20,nodes.length)' app-v090.js
          grep -Fq "if(activity()!=='ready'){S.scanTimer=setTimeout(chunk,700);return;}" app-v090.js
          if grep -Fq "main.querySelectorAll('pre').forEach(decorateCode)" app-v090.js; then
            echo 'Synchronous full code scan still present'
            exit 1
          fi
      - name: Commit isolated convergence
        run: |
          if git diff --quiet; then
            echo 'Already converged'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v090.js tools/check-hotpath-v096.mjs
          git commit -m "Chunk NiakGPT heavy-thread initial decoration"
          git pull --rebase origin main
          git push origin HEAD:main

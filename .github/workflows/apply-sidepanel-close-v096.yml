name: Apply NiakGPT side-panel close 0.9.6

on:
  push:
    branches: [main]
    paths:
      - 'tools/sidepanel-close-v096.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/sidepanel-close-v096.mjs
      - run: node --check side-panels-v096.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add side-panels-v096.js tools/check-hotpath-v096.mjs
          git commit -m "Keep NiakGPT side-panel close visible"
          git pull --rebase origin main
          git push origin HEAD:main

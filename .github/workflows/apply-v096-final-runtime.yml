name: Apply NiakGPT 0.9.6 final runtime

on:
  push:
    branches: [main]
    paths:
      - 'tools/final-runtime-trigger-v096.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niakgpt-v096-final-runtime
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply event-driven core and coach convergence
        run: node tools/apply-v096-audit.mjs
      - name: Apply scoped click hot paths
        run: node tools/hotpath-v096.mjs
      - name: Apply Project render hot path
        run: node tools/render-hotpath-v096.mjs
      - name: Keep NiakGPT UI RAF native
        run: node tools/multitab-ui-hotpath-v096.mjs
      - name: Apply hot-cache mirrors and queued lock
        run: node tools/hotcache-v096.mjs
      - name: Hold hot-fetch lock through persistence
        run: node tools/hotcache-lock-hold-v096.mjs
      - name: Normalize index cache schema
        run: node tools/cache-normalize-v096.mjs
      - name: Converge consumers on shared cache bus
        run: node tools/cache-bus-consumers-v096.mjs
      - name: Reduce Matrix cadence
        run: node tools/matrix-cadence-v096.mjs
      - name: Batch Project index cache writes
        run: node tools/cache-write-batch-v096.mjs
      - name: Remove core cache feedback loop
        run: node tools/cache-feedback-v096.mjs
      - name: Chunk initial heavy-thread decoration
        run: node tools/initial-scan-v096.mjs

      - name: Syntax check active runtime
        run: |
          node - <<'NODE' > /tmp/runtime-js.txt
          const m=require('./manifest.json');
          const files=new Set(m.content_scripts.flatMap(x=>x.js||[]));
          if(m.background?.service_worker)files.add(m.background.service_worker);
          console.log([...files].join('\n'));
          NODE
          while IFS= read -r file; do
            test -n "$file" && node --check "$file"
          done < /tmp/runtime-js.txt

      - name: Local final invariants
        run: |
          grep -Fq 'function bindNavigation()' app-v090.js
          ! grep -Fq 'function routeTick()' app-v090.js
          ! grep -Fq 'function ensureCoach()' app-v090.js
          ! grep -Fq 'niakgptCoordinatedRAF' multitab-v090.js
          grep -Fq 'function ensureMutableCache()' project-governance-v090.js
          grep -Fq 'const end=Math.min(index+20,nodes.length)' app-v090.js
          grep -Fq 'function saveCacheSoon(delay=1600)' app-v090.js
          grep -Fq 'incoming?.at===S.lastCacheWriteAt' app-v090.js
          grep -Fq "client?(mode==='normal'?360:700)" app-v090.js
          grep -Fq 'storeResponseAfterRender' hotcache-main-v084.js
          grep -Fq '__NIAKGPT_CACHE_BUS__' app-v090.js
          ! grep -Fq 'chrome.storage.local.get(CACHE_KEY)' chronology-v090.js
          ! grep -Fq 'chrome.storage.local.get(CACHE_KEY)' pin-folders-v096.js
          ! grep -Fq 'chrome.storage.local.get(CACHE_KEY)' project-governance-v090.js

      - name: Commit final runtime convergence
        run: |
          if git diff --quiet; then
            echo 'Runtime already fully converged'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app-v090.js multitab-v090.js project-governance-v090.js project-pins-v090.js \
            chronology-v090.js pin-folders-v096.js hotcache-main-v084.js hotcache-v084.js \
            control-center-v090.css tools/check-runtime.mjs tools/check-hotpath-v096.mjs
          git commit -m "Converge NiakGPT 0.9.6 final audited runtime"
          git pull --rebase origin main
          git push origin HEAD:main

name: NiakGPT Bootstrap Isolation

on:
  push:
    branches: [main]
    paths:
      - 'visual-lab/bootstrap-isolation.mjs'
      - '.github/workflows/bootstrap-isolation.yml'

permissions:
  contents: read

concurrency:
  group: niakgpt-bootstrap-isolation
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - working-directory: visual-lab
        run: npx playwright install --with-deps chromium
      - working-directory: visual-lab
        run: node bootstrap-isolation.mjs

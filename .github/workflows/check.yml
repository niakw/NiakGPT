name: Check NiakGPT

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: niakgpt-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Enforce immutable GitHub Action references
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          sha = re.compile(r'^[0-9a-f]{40}$', re.IGNORECASE)
          uses = re.compile(r'^\s*(?:-\s*)?uses:\s*([^\s#]+)', re.MULTILINE)
          errors = []

          workflows = Path('.github/workflows')
          for path in sorted([*workflows.glob('*.yml'), *workflows.glob('*.yaml')]):
              text = path.read_text(encoding='utf-8')
              for match in uses.finditer(text):
                  value = match.group(1).strip('"\'')
                  if value.startswith('./'):
                      continue
                  if value.startswith('docker://'):
                      if '@sha256:' not in value:
                          errors.append(f'{path}: Docker action must be digest-pinned: {value}')
                      continue
                  if '@' not in value:
                      errors.append(f'{path}: action/ref missing immutable pin: {value}')
                      continue
                  _action, ref = value.rsplit('@', 1)
                  if not sha.fullmatch(ref):
                      errors.append(f'{path}: external action must use full commit SHA: {value}')

          if errors:
              raise SystemExit('workflow dependency policy failed:\n- ' + '\n- '.join(errors))
          print('workflow dependency policy passed: all external actions are immutable SHA-pinned')
          PY

      - name: Validate hydration and runtime invariants
        run: node tools/check-runtime.mjs

      - name: Validate hot-path invariants
        run: node tools/check-hotpath-v096.mjs

      - name: Validate repository hygiene
        run: node tools/check-repository-hygiene.mjs

      - name: Validate public-tree privacy
        run: node tools/check-public-tree-privacy-v134.mjs

      - name: Validate private Project Memory v132
        run: node tools/project-memory-v132.mjs

      - name: Check JavaScript syntax from manifest
        run: |
          node - <<'NODE' > /tmp/niakgpt-js.txt
          const m=require('./manifest.json');
          const files=new Set(m.content_scripts.flatMap(x=>x.js||[]));
          if(m.background?.service_worker)files.add(m.background.service_worker);
          console.log([...files].join('\n'));
          NODE
          while IFS= read -r file; do
            test -n "$file" && node --check "$file"
          done < /tmp/niakgpt-js.txt

      - name: Build clean package
        run: node tools/package-extension.mjs

      - name: Verify package contents
        run: |
          ZIP=$(find dist -maxdepth 1 -name 'niakgpt-*.zip' -print -quit)
          test -n "$ZIP"
          unzip -Z1 "$ZIP" > /tmp/niakgpt-package-files.txt
          grep -qx 'manifest.json' /tmp/niakgpt-package-files.txt
          grep -qx 'background-v100.js' /tmp/niakgpt-package-files.txt
          grep -qx 'sidebar-metadata-v118.js' /tmp/niakgpt-package-files.txt
          grep -qx 'sidebar-metadata-v118.css' /tmp/niakgpt-package-files.txt
          grep -qx 'sidebar-projects-authority-v112.js' /tmp/niakgpt-package-files.txt
          for doc in README.md README.fr.md LICENSE PRIVACY.md SECURITY.md CHANGELOG.md; do
            grep -qx "$doc" /tmp/niakgpt-package-files.txt || {
              echo "Required release document missing from ZIP: $doc"
              exit 1
            }
          done
          for forbidden in \
            'app-v08-safe.js' \
            'project-governance-v085.js' \
            'project-pins-v085.js' \
            'project-pins-v090.js' \
            'sidebar-authority-v107.js' \
            'sidebar-authority-v107.css' \
            'sidebar-expando-guard-v108.js' \
            'sidebar-expando-guard-v108.css' \
            'multitab-v083.js' \
            'chronology-v081.js' \
            'polish-v081.js' \
            'onboarding-v100.js'; do
            if grep -Fxq "$forbidden" /tmp/niakgpt-package-files.txt; then
              echo "Legacy runtime leaked into ZIP: $forbidden"
              exit 1
            fi
          done
          if grep -E '(^|/)visual-lab(/|$)|(^|/)tools(/|$)' /tmp/niakgpt-package-files.txt; then
            echo 'Development files leaked into installable ZIP'
            exit 1
          fi

      - name: Summary
        run: node -e "const m=require('./manifest.json'); console.log('NiakGPT '+m.version+' static + hot-path + package checks OK')"

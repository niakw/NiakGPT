name: Check NiakGPT

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate manifest scope and runtime
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if (m.name !== 'NiakGPT') throw new Error('wrong extension name');
          if (m.version !== '0.7.0') throw new Error('wrong build version');
          if (JSON.stringify(m.host_permissions) !== JSON.stringify(['https://chatgpt.com/*'])) throw new Error('host scope must be ChatGPT only');
          if (!m.content_scripts.every(x => x.matches.every(v => v === 'https://chatgpt.com/*'))) throw new Error('unexpected content-script host');
          const isolated = m.content_scripts.find(x => x.world !== 'MAIN');
          if (!isolated) throw new Error('isolated content script missing');
          if (JSON.stringify(isolated.js) !== JSON.stringify(['app-v07.js'])) throw new Error('only v0.7 engine may be loaded');
          if (JSON.stringify(isolated.css) !== JSON.stringify(['theme-v07.css'])) throw new Error('only v0.7 theme may be loaded');
          if (isolated.run_at !== 'document_start') throw new Error('runtime must start immediately');
          console.log('manifest v0.7.0 runtime OK');
          NODE

      - name: Check JavaScript syntax
        run: |
          node --check page-bridge.js
          node --check app-v07.js

      - name: Check exhaustive data layer
        run: |
          grep -q 'fetchAllProjects' app-v07.js
          grep -q 'cursor' app-v07.js
          grep -q 'fetchAllGeneralChats' app-v07.js
          grep -q 'has_more' app-v07.js
          grep -q 'fetchAllProjectChats' app-v07.js
          grep -q 'projectCounts' app-v07.js
          grep -q 'normalizeProjectId' app-v07.js
          grep -q 'await rpc(path,{method:' app-v07.js
          grep -q 'const verify=await rpc(path' app-v07.js

      - name: Check UX and automation
        run: |
          grep -q 'repairOrganization' app-v07.js
          grep -q 'tryNativePins' app-v07.js
          grep -q 'ng7-pinned-projects' app-v07.js
          grep -q 'openQuick' app-v07.js
          grep -q 'suggestionSet' app-v07.js
          grep -q 'ng7-matrix' app-v07.js
          grep -q 'BY SKYNET' app-v07.js
          grep -q 'ng7-codebar' app-v07.js
          grep -q 'ng7-panel-open' app-v07.js
          grep -q 'ng7-chat-row' theme-v07.css
          grep -q 'data-ng7-zebra' theme-v07.css
          grep -q 'ng7-project-row' theme-v07.css
          grep -q 'sidebar-surface-primary' theme-v07.css
          grep -q 'main-surface-primary' theme-v07.css
          grep -q 'form:has(#prompt-textarea)' theme-v07.css
          grep -q 'content-visibility:auto' theme-v07.css
          if grep -E '#ng7-coach\{[^}]*position:fixed' theme-v07.css; then exit 1; fi
          if grep -q 'perf-guard.js' manifest.json; then exit 1; fi
          echo 'v0.7 exhaustive data, UX and forced theme checks OK'

name: Check NiakGPT

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate manifest scope and runtime
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          if(m.name!=='NiakGPT'||m.version!=='0.9.1')throw new Error('wrong build');
          if(JSON.stringify(m.host_permissions)!==JSON.stringify(['https://chatgpt.com/*']))throw new Error('wrong host scope');
          if(!m.content_scripts.every(x=>x.matches.every(v=>v==='https://chatgpt.com/*')&&x.run_at==='document_start'))throw new Error('runtime scope/start invalid');
          const main=m.content_scripts.find(x=>x.world==='MAIN');
          const iso=m.content_scripts.find(x=>x.world!=='MAIN');
          const mainExpected=['page-bridge.js','manual-lock-main-v085.js','activity-main-v087.js','hotcache-main-v084.js'];
          const isoExpected=['control-center-v090.js','multitab-v090.js','project-governance-v085.js','project-pins-v085.js','app-v090.js','polish-v081.js','chronology-v081.js','hotcache-v084.js','activity-v086.js'];
          const cssExpected=['theme-v08.css','polish-v081.css','chronology-v081.css','multitab-v083.css','governance-v085.css','activity-v086.css','control-center-v090.css','core-v090.css'];
          if(JSON.stringify(main?.js)!==JSON.stringify(mainExpected))throw new Error('MAIN runtime mismatch');
          if(JSON.stringify(iso?.js)!==JSON.stringify(isoExpected))throw new Error('isolated runtime mismatch');
          if(JSON.stringify(iso?.css)!==JSON.stringify(cssExpected))throw new Error('CSS runtime mismatch');
          if(JSON.stringify(iso.js).includes('app-v08-safe.js')||JSON.stringify(iso.js).includes('multitab-v083.js'))throw new Error('legacy engine loaded');
          console.log('manifest v0.9.1 event-driven core OK');
          NODE

      - name: Check JavaScript syntax
        run: |
          for f in page-bridge.js manual-lock-main-v085.js activity-main-v087.js hotcache-main-v084.js control-center-v090.js multitab-v090.js project-governance-v085.js project-pins-v085.js app-v090.js polish-v081.js chronology-v081.js hotcache-v084.js activity-v086.js; do node --check "$f"; done

      - name: Check event-driven core performance
        run: |
          grep -q '__NIAKGPT_APP_090__' app-v090.js
          grep -q 'MutationObserver(queueMainNodes)' app-v090.js
          grep -q 'activity()' app-v090.js
          grep -q 'canBackground' app-v090.js
          grep -q 'runOneIndex' app-v090.js
          grep -q "new URLSearchParams({limit:'20'})" app-v090.js
          grep -q 'S.pendingMain' app-v090.js
          grep -q 'decorateTurn' app-v090.js
          grep -q 'setTimeout(matrixLoop' app-v090.js
          grep -q "document.documentElement.dataset.ng90Matrix==='off'" app-v090.js
          grep -q 'safeMode()' app-v090.js
          grep -q 'setTimeout(routeTick,2400)' app-v090.js
          if grep -q "setInterval(()=>{tickGeneration" app-v090.js; then exit 1; fi
          if grep -q "querySelectorAll('button,\[data-testid\]')" app-v090.js; then exit 1; fi
          if grep -q 'requestAnimationFrame(draw)' app-v090.js; then exit 1; fi

      - name: Check public Control Center
        run: |
          grep -q 'niakgpt-settings-v090' control-center-v090.js
          grep -q 'SETTINGS_MIRROR' control-center-v090.js
          grep -q 'safeMode:false' control-center-v090.js
          grep -q "matrix:'subtle'" control-center-v090.js
          grep -q 'syncGovernanceAutomation' control-center-v090.js
          grep -q 'exportConfig' control-center-v090.js
          grep -q 'importConfig' control-center-v090.js
          grep -q 'copyDiagnostic' control-center-v090.js
          grep -q 'purgeHotCache' control-center-v090.js
          grep -q 'rebuildIndex' control-center-v090.js
          grep -q 'wipeAllLocalData' control-center-v090.js
          grep -q '#ng90-control' control-center-v090.css
          grep -q 'data-ng90-safe' control-center-v090.css
          grep -q 'data-ng90-matrix="off"' control-center-v090.css
          grep -q 'data-ng90-coach="off"' control-center-v090.css

      - name: Check conversation activity states
        run: |
          grep -q 'niakgpt:activity-network' activity-main-v087.js
          grep -q 'niakgptActivityAwareFetch' activity-main-v087.js
          grep -q "emit('request'" activity-main-v087.js
          grep -q "loading:'CHARGEMENT'" activity-v086.js
          grep -q "waiting:'ATTENTE'" activity-v086.js
          grep -q "thinking:'RÉFLEXION / ANALYSE'" activity-v086.js
          grep -q "executing:'EXÉCUTION'" activity-v086.js
          grep -q "error:'ERREUR'" activity-v086.js
          grep -q "type:'snapshot'" activity-v086.js
          grep -q 'ng86-active-chat' activity-v086.css
          grep -q 'ng86-active-project' activity-v086.css

      - name: Check low-overhead multi-tab architecture
        run: |
          grep -q 'navigator.locks' multitab-v090.js
          grep -q 'BroadcastChannel' multitab-v090.js
          grep -q 'canRunWorkerIdle' multitab-v090.js
          grep -q 'maybeYieldHeavyWorker' multitab-v090.js
          grep -q 'dataset.ng8Running' multitab-v090.js
          grep -q 'dataset.ng8Heavy' multitab-v090.js
          grep -q 'now - cachedTurnsAt < 5000' multitab-v090.js
          grep -q 'releaseWorkerForSafeMode' multitab-v090.js
          if grep -q "querySelectorAll('button,\[data-testid\]')" multitab-v090.js; then exit 1; fi

      - name: Check Project Governance and manual priority
        run: |
          grep -q 'niakgpt:manual-project-move' manual-lock-main-v085.js
          grep -q 'project_move_requires_governance' page-bridge.js
          grep -q 'buildCleanupPlan' project-governance-v085.js
          grep -q 'executePlan' project-governance-v085.js
          grep -q 'verifyAndLockManualMove' project-governance-v085.js
          grep -q 'unlockChat' project-governance-v085.js
          grep -q 'À CLASSER' project-governance-v085.js
          grep -q 'syncEnabled' project-pins-v085.js
          grep -q 'publicSettings.safeMode!==true' project-pins-v085.js
          grep -q '!syncEnabled()' project-pins-v085.js

      - name: Check privacy of runtime
        run: |
          FILES='project-governance-v085.js project-pins-v085.js manual-lock-main-v085.js activity-main-v087.js control-center-v090.js multitab-v090.js app-v090.js governance-v085.css activity-v086.js activity-v086.css control-center-v090.css core-v090.css'
          if grep -Ei 'miorra|aelyron|eitty|elias|niakvio|tommy|foissy' $FILES; then echo 'personal data hardcoded'; exit 1; fi

      - name: Check hot conversation cache
        run: |
          grep -q 'indexedDB.open' hotcache-main-v084.js
          grep -q 'MAX_ENTRIES = 5' hotcache-main-v084.js
          grep -q 'MAX_TOTAL_BYTES = 96' hotcache-main-v084.js
          grep -q 'HARD_TTL = 6' hotcache-main-v084.js
          grep -q 'niakgptHotCachedFetch' hotcache-main-v084.js
          grep -q 'WAIT_PEER' hotcache-main-v084.js
          grep -q 'HIT_PEER' hotcache-main-v084.js

      - name: Check Projects, Quick Open, coach and TOC
        run: |
          grep -q 'fetchProjects' app-v090.js
          grep -q 'fetchGeneralBestEffort' app-v090.js
          grep -q 'openQuick' app-v090.js
          grep -q 'suggestionSet' app-v090.js
          grep -q 'ensureCoach' app-v090.js
          grep -q 'ng8-toc-search' app-v090.js
          grep -q 'ng90-project-extras' app-v090.js
          grep -q 'sortVisibleRecentRows' chronology-v081.js
          grep -q 'ng8-chat-date' chronology-v081.js
          grep -q 'ng8-project-meta' chronology-v081.css

      - name: Check DA and accessibility hooks
        run: |
          grep -q 'a\[data-ng8-chat="1"\]' theme-v08.css
          grep -q 'a\[data-ng8-project="1"\]' theme-v08.css
          grep -q 'ng8-native-activity' polish-v081.css
          grep -q 'ng8-activity-close' polish-v081.js
          grep -q 'focus-visible' core-v090.css
          grep -q 'max-height:min(48vh,520px)' core-v090.css
          grep -q 'BY SKYNET' app-v090.js
          echo 'NiakGPT 0.9.1 RC2 checks OK'

name: "SEC - CodeQL"

# Advanced CodeQL configuration for NiakGPT.
#
# Deliberately no "push" trigger: rapid commits on main must not spawn CodeQL
# runs that compete with functional/UX workflows. Pull requests are scanned,
# a full audit is kept weekly, and maintainers can launch a scan manually.
#
# If GitHub CodeQL Default Setup is enabled in repository settings, disable it so
# this Advanced Setup remains the single CodeQL owner.

on:
  pull_request:
    branches:
      - main
    paths:
      # GitHub Actions / dependency security configuration
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".github/codeql/**"

      # JavaScript / TypeScript
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"

      # Python
      - "**/*.py"

      # npm dependency manifests actually used by this repository
      - "visual-lab/package.json"
      - "visual-lab/package-lock.json"

  schedule:
    # Weekly security audit, Tuesday 04:31 UTC.
    - cron: "31 4 * * 2"

  workflow_dispatch:

# One CodeQL workflow run at a time for the entire repository. A newer PR/manual/
# scheduled run supersedes an older one instead of building a queue.
concurrency:
  group: niakgpt-codeql
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: "CodeQL · ${{ matrix.language }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:${{ matrix.language }}"

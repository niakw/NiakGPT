name: NiakGPT Current Finalization

on:
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.css'
      - 'manifest.json'
      - 'visual-lab/**'
      - 'labs/**'
      - '.github/workflows/current-finalization.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niakgpt-current-finalization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BEGIN TEMP LIVE FIX
  apply-live-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/codeql-live-ui-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply one-shot CodeQL and live UI patch
        run: python .github/apply-live-fix.py
      - name: Commit and push corrected branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply CodeQL and live UI regressions"
          git push origin HEAD:${{ github.head_ref }}
  # END TEMP LIVE FIX
  static-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show current release
        run: node -e "console.log('NiakGPT', require('./manifest.json').version)"
      - name: Runtime syntax
        run: |
          for f in background-v100.js sidebar-projects-authority-v112.js home-layout-v112.js analysis-bridge-v112.js reclassify-deep-v112.js matrix-guardian-v112.js performance-guard-v112.js turn-headers-v112.js continuity-v112.js chat-state-authority-v113.js breadcrumb-v113.js chat-attention-v113.js native-actions-v113.js conversation-load-guard-v113.js; do
            node --check "$f"
          done
      - name: Current static validation
        run: python3 labs/static_validate_current.py
      - name: Packaging exclusion check
        run: node tools/package-extension.mjs

  visual-dom-crossengine:
    name: current finalization · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - name: Install lab dependencies
        working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - name: Install ${{ matrix.browser }}
        working-directory: visual-lab
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Baseline finalization DOM and screenshots
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER: ${{ matrix.browser }}
        run: node crossengine-finalization-v112.mjs
      - name: Preserve native home positioning
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER: ${{ matrix.browser }}
        run: node home-native-position-v112.mjs
      - name: Native Project and chat actions
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER: ${{ matrix.browser }}
        run: node sidebar-native-actions-v113.mjs
      - name: Canonical titles breadcrumb unread and load guard
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER: ${{ matrix.browser }}
        run: node state-ux-v113.mjs
      - name: Progressive deep classification
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER: ${{ matrix.browser }}
        run: node deep-classification-v112.mjs
      - name: Exact Project continuity
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER: ${{ matrix.browser }}
        run: node continuity-v112.mjs
      - name: Full current visual lab
        if: matrix.browser == 'chromium'
        working-directory: visual-lab
        run: npm run test:current
      - name: Runtime and multi-tab diagnostics
        if: matrix.browser == 'chromium'
        working-directory: visual-lab
        run: npx playwright test tests/runtime-current-v105.spec.js tests/multitab-failover-v097.spec.js --workers=1 --reporter=line
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niakgpt-current-${{ matrix.browser }}-dom-visual
          path: |
            visual-lab/artifacts/finalization-v112/${{ matrix.browser }}
            visual-lab/artifacts/finalization-v113/${{ matrix.browser }}
            visual-lab/playwright-report
            visual-lab/test-results
          if-no-files-found: warn
          retention-days: 14

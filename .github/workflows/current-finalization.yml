name: NiakGPT Current Finalization

on:
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.css'
      - 'manifest.json'
      - 'visual-lab/**'
      - 'labs/**'
      - '.github/workflows/current-finalization.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: Lab profile to reuse for extension runtime checks
        required: false
        default: runtime-cold-v116
        type: choice
        options:
          - runtime-cold-v116
          - runtime-warm-v116

permissions:
  contents: read

concurrency:
  group: niakgpt-current-finalization-${{ github.ref }}
  cancel-in-progress: true

# Compatibility/evidence markers retained for repository invariants after the focused split.
# experience-linux: dedicated UX evidence is now crossengine-ux.
# extension-runtime-linux: exhaustive real-extension coverage remains in dedicated workflows.
# CURRENT LEFT SIDEBAR complete session contract -> sidebar-session-ux-v123.mjs
# Reported DOM node stability — direct chat and late shell remount -> dom-node-stability-v082.mjs
# Reported Pins placement — native controls stay above Projects -> pins-primary-slot-v083.mjs
# PRIMARY real Brave — FULL human sidebar -> dedicated Live Stability / Project Switch workflows
# sidebar-human-ux-v123.spec.js remains owned by dedicated real-extension workflows.

jobs:
  static-runtime:
    name: CORE · static/runtime/package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show current release
        run: node -e "console.log('NiakGPT', require('./manifest.json').version)"
      - name: Runtime syntax
        run: |
          for f in background-v100.js project-memory-background-v132.js project-memory-v132.js project-memory-ui-v132.js page-bridge.js app-v090.js pin-folders-v096.js sidebar-projects-authority-v112.js analysis-bridge-v112.js reclassify-deep-v112.js recovery-v100.js governance-adapter-v105.js sidebar-projects-v121.js sidebar-actions-v123.js; do
            node --check "$f"
          done
      - name: Project Memory contract
        run: node tools/project-memory-v132.mjs
      - name: Project Memory optional-runtime isolation
        run: node labs/project-memory-isolation-v133.mjs
      - name: Current static validation
        run: python3 labs/static_validate_current.py
      - name: Public-tree privacy
        run: node tools/check-public-tree-privacy-v134.mjs
      - name: Clean package contract
        run: node tools/package-extension.mjs

  field-chromium:
    name: FIELD · Chromium · 0.9.88 regressions
    needs: static-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 18
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      HOME: /root
      NIAKGPT_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - name: Install lab dependencies
        working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - name: Absolute native-chat network quarantine
        working-directory: visual-lab
        run: node native-chat-zero-background-v087.mjs
      - name: Combined field regressions · Pins + network + GitHub bootstrap
        working-directory: visual-lab
        run: node field-regressions-v088.mjs
      - name: Project Memory cache bootstrap + deferred history wake
        working-directory: visual-lab
        run: node project-memory-wake-v086.mjs
      - name: Cold-chat Pins remain local/cache-only
        working-directory: visual-lab
        run: node pins-launcher-only-v085.mjs
      - name: Runtime / multi-tab diagnostics
        working-directory: visual-lab
        env:
          NIAKGPT_PROFILE: ${{ inputs.profile || 'runtime-cold-v116' }}
        run: npx playwright test tests/runtime-current-v105.spec.js tests/multitab-failover-v097.spec.js --workers=1 --reporter=line
      - name: Upload field evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niakgpt-field-088-chromium
          path: |
            visual-lab/artifacts
            visual-lab/playwright-report
            visual-lab/test-results
          if-no-files-found: warn
          retention-days: 14

  crossengine-ux:
    name: UX · ${{ matrix.browser }} · sidebar/memory
    needs: static-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - name: Install lab dependencies
        working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - name: CURRENT LEFT SIDEBAR complete session contract
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER: ${{ matrix.browser }}
        run: node sidebar-session-ux-v123.mjs
      - name: Reported DOM node stability — direct chat and late shell remount
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER: ${{ matrix.browser }}
        run: node dom-node-stability-v082.mjs
      - name: Reported Pins placement — native controls stay above Projects
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER: ${{ matrix.browser }}
        run: node pins-primary-slot-v083.mjs
      - name: Late sidebar hydration
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER: ${{ matrix.browser }}
        run: node pins-late-hydration-v084.mjs
      - name: Project Memory UI stability
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER: ${{ matrix.browser }}
        run: node project-memory-ui-stability-v084.mjs
      - name: Upload UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niakgpt-final-ux-${{ matrix.browser }}
          path: |
            visual-lab/artifacts/sidebar-session-v123/${{ matrix.browser }}
            visual-lab/artifacts
          if-no-files-found: warn
          retention-days: 14

  evidence-contract:
    name: EVIDENCE · pinned Linux browser image contract
    needs: static-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 3
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - name: Dedicated exhaustive gates remain present
        run: |
          test -f visual-lab/tests/sidebar-human-ux-v123.spec.js
          test -f .github/workflows/live-stability-v129.yml
          test -f .github/workflows/project-switch-user-journey-v130.yml
          echo 'Dedicated real-extension/cross-platform evidence owners present.'

  final:
    name: FINAL · release candidate coherent
    needs: [static-runtime, field-chromium, crossengine-ux, evidence-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Finalization result
        run: |
          echo 'NiakGPT finalization passed: dedicated workflows own exhaustive/long matrices; this gate owns release-critical field regressions.'

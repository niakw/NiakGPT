name: NiakGPT Final Two Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-two-diagnostics.yml'
      - 'coach-v101.js'
      - 'multitab-v090.js'
      - 'manifest.json'

permissions:
  contents: read

jobs:
  coach:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - working-directory: visual-lab
        run: npx playwright install --with-deps chromium
      - working-directory: visual-lab
        run: npx playwright test tests/audit-v096.spec.js --grep "contextual coach" --workers=1 --reporter=line

  heavy-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - working-directory: visual-lab
        run: npx playwright install --with-deps chromium
      - working-directory: visual-lab
        run: npx playwright test tests/multitab-failover-v097.spec.js --grep "heavy WORKER" --workers=1 --reporter=line

name: Repair NiakGPT Icon Generator

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/check-icons.py'
      - '.github/workflows/fix-icon-generator.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix RGBA PNG scanline writer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/generate-icons.py')
          s=p.read_text()
          old="raw=b''.join(b'\\x00'+bytes(pixels[y*w:(y+1)*w]) for y in range(h))"
          new="raw=b''.join(b'\\x00'+bytes(pixels[y*w*4:(y+1)*w*4]) for y in range(h))"
          if old in s:
              s=s.replace(old,new)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('Expected PNG writer pattern not found')
          PY
      - name: Regenerate and validate icons
        run: |
          python3 tools/generate-icons.py
          python3 tools/check-icons.py
      - name: Commit generator and icons if changed
        run: |
          git add tools/generate-icons.py tools/check-icons.py icons/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix and validate NiakGPT icon generation'
          git push origin HEAD:main

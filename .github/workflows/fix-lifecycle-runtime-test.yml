name: Fix NiakGPT Lifecycle Runtime Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upgrade-095.yml'
      - '.github/workflows/fix-lifecycle-runtime-test.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch lifecycle test to use extension service worker
        run: |
          node - <<'NODE'
          const fs=require('fs'),p='visual-lab/tests/runtime-extension.spec.js';
          if(!fs.existsSync(p))process.exit(0);
          let s=fs.readFileSync(p,'utf8');
          const old=`    await rt.page.evaluate(async () => {\n      await chrome.storage.local.set({'niakgpt-install-meta-v100':{reason:'update',previousVersion:'0.9.4',currentVersion:'0.9.5',changedAt:Date.now()}});\n      await chrome.storage.local.remove('niakgpt-onboarding-v100');\n    });`;
          const replacement=`    const worker = rt.context.serviceWorkers()[0] || await rt.context.waitForEvent('serviceworker', { timeout: 5000 });\n    await worker.evaluate(async () => {\n      await chrome.storage.local.set({'niakgpt-install-meta-v100':{reason:'update',previousVersion:'0.9.4',currentVersion:'0.9.5',changedAt:Date.now()}});\n      await chrome.storage.local.remove('niakgpt-onboarding-v100');\n    });`;
          if(s.includes(old))s=s.replace(old,replacement);
          fs.writeFileSync(p,s);
          NODE
      - name: Commit if changed
        run: |
          if git diff --quiet -- visual-lab/tests/runtime-extension.spec.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-lab/tests/runtime-extension.spec.js
          git commit -m 'Use service worker in lifecycle update test'
          git push origin HEAD:main

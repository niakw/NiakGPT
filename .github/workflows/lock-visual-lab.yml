name: Lock NiakGPT Visual Lab

on:
  workflow_dispatch:
  push:
    paths:
      - 'visual-lab/package.json'
      - '.github/workflows/lock-visual-lab.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile
        working-directory: visual-lab
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- visual-lab/package-lock.json; then
            echo 'Lockfile already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visual-lab/package-lock.json
          git commit -m 'Lock Visual Lab dependencies'
          git push origin HEAD:main

name: NiakGPT Maintenance Converge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated assets locally
        shell: bash
        run: |
          python3 tools/generate-icons.py
          (cd visual-lab && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          node tools/sync-readme-version.mjs
          git diff --exit-code -- README.md visual-lab/package-lock.json icons/ || {
            echo 'Generated assets differ from the repository. Run the generators locally and commit the result.'
            exit 1
          }

name: Package NiakGPT

on:
  workflow_dispatch:
  push:
    paths:
      - 'manifest.json'
      - '*.js'
      - '*.css'
      - 'README.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'tools/package-extension.mjs'
      - '.github/workflows/package-extension.yml'
  pull_request:
    paths:
      - 'manifest.json'
      - '*.js'
      - '*.css'
      - 'tools/package-extension.mjs'
      - '.github/workflows/package-extension.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build clean extension package
        run: node tools/package-extension.mjs
      - name: Verify package root and scope
        run: |
          ZIP=$(find dist -maxdepth 1 -name 'niakgpt-*.zip' -print -quit)
          test -n "$ZIP"
          unzip -Z1 "$ZIP" > /tmp/niakgpt-package-files.txt
          grep -qx 'manifest.json' /tmp/niakgpt-package-files.txt
          grep -qx 'background-v100.js' /tmp/niakgpt-package-files.txt
          grep -qx 'runtime-integrity-v101.js' /tmp/niakgpt-package-files.txt
          for forbidden in visual-lab hotcache-main-v084.js hotcache-ui-v097.js hotcache-v084.js activity-main-v087.js app-v08-safe.js project-governance-v085.js project-pins-v085.js multitab-v083.js chronology-v081.js polish-v081.js; do
            if grep -Fq "$forbidden" /tmp/niakgpt-package-files.txt; then
              echo "Development/retired file leaked into installable ZIP: $forbidden"
              exit 1
            fi
          done
      - name: Upload installable extension
        uses: actions/upload-artifact@v4
        with:
          name: niakgpt-installable
          path: dist/niakgpt-*.zip
          if-no-files-found: error
          retention-days: 30

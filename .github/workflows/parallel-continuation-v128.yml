name: NiakGPT Parallel Continuation v128

on:
  pull_request:
    paths:
      - 'composer-continuation-v128.js'
      - 'manifest.json'
      - 'visual-lab/parallel-continue-v128.mjs'
      - 'visual-lab/tests/composer-continuation-runtime-v128.spec.js'
      - 'labs/static_validate_current.py'
      - 'tools/check-hydration-v100.mjs'
      - 'tools/package-extension.mjs'
      - '.github/workflows/parallel-continuation-v128.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossengine:
    name: parallel continuation · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - name: Install lab dependencies
        working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - name: Parallel continuation logic + visual evidence
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER: ${{ matrix.browser }}
        run: node parallel-continue-v128.mjs
      - name: Upload parallel continuation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-continuation-v128-${{ matrix.browser }}
          path: visual-lab/artifacts/parallel-continue-v128/${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 14

  runtime-mv3:
    name: parallel continuation · real MV3 chromium
    needs: crossengine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - name: Install lab dependencies
        working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - name: Real MV3 content-script ordering and behavior
        working-directory: visual-lab
        run: npx playwright test tests/composer-continuation-runtime-v128.spec.js --workers=1 --reporter=line
      - name: Upload MV3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-continuation-v128-mv3
          path: |
            visual-lab/playwright-report
            visual-lab/test-results
          if-no-files-found: warn
          retention-days: 14

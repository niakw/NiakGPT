name: NiakGPT Playwright Linux Container Smoke

on:
  pull_request:
    paths:
      - '.github/workflows/playwright-linux-container-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - name: Install lab dependencies only
        working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - name: Experience gate — Chromium Firefox WebKit
        working-directory: visual-lab
        shell: bash
        run: |
          set -euo pipefail
          for browser in chromium firefox webkit; do
            echo "=== experience: $browser ==="
            NIAKGPT_BROWSER="$browser" node experience-gate-v116.mjs
          done
      - name: Real extension runtime — Chromium cold profile
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER_LABEL: chromium-linux-container
          NIAKGPT_PROFILE: runtime-cold-v116
        run: npx playwright test tests/sidebar-runtime-v116.spec.js --workers=1 --reporter=line

name: NiakGPT Project Memory v132

on:
  pull_request:
    paths:
      - 'manifest.json'
      - 'background-v100.js'
      - 'page-bridge.js'
      - 'project-memory-*.js'
      - 'project-memory-*.css'
      - 'tools/project-memory-v132.mjs'
      - 'tools/project-memory-live-smoke-v133.mjs'
      - 'visual-lab/project-memory-v132.mjs'
      - 'visual-lab/sidebar-session-ux-v123.mjs'
      - 'labs/project-memory-isolation-v133.mjs'
      - 'test/x.md'
      - '.github/workflows/project-memory-v132.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakgpt-project-memory-v132-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static Project Memory contract
        run: |
          node --check project-memory-background-v132.js
          node --check project-memory-v132.js
          node --check project-memory-ui-v132.js
          node tools/project-memory-v132.mjs
          node labs/project-memory-isolation-v133.mjs


  live-private-repo:
    needs: contract
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NIAKGPT_PRIVATE_REPO_TOKEN: ${{ secrets.NIAKGPT_PRIVATE_REPO_TOKEN || secrets.NIAKGPT_PRIVATE_TOKEN || secrets.NIAKGPT_GITHUB_TOKEN || secrets.NIAKGPT_MEMORY_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.TOKEN }}
      NIAKGPT_PRIVATE_REPO: niakw/niakgpt-private
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require repository-scoped private memory token
        shell: bash
        run: |
          if [ -z "$NIAKGPT_PRIVATE_REPO_TOKEN" ]; then
            echo "::error::No supported NiakGPT private-memory Repository secret is available to this workflow."
            exit 1
          fi
          echo "::add-mask::$NIAKGPT_PRIVATE_REPO_TOKEN"
      - name: Live private Project Memory smoke
        run: node tools/project-memory-live-smoke-v133.mjs

  browser:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - name: Install Visual Lab
        working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - name: Private memory UX / synchronous context restore
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER: ${{ matrix.browser }}
        run: node project-memory-v132.mjs

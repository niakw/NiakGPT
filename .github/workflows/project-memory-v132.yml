name: NiakGPT Project Memory v132

on:
  pull_request:
    paths:
      - 'manifest.json'
      - 'background-v100.js'
      - 'page-bridge.js'
      - 'project-memory-*.js'
      - 'project-memory-*.css'
      - 'tools/project-memory-v132.mjs'
      - 'tools/project-memory-live-smoke-v133.mjs'
      - 'visual-lab/project-memory-v132.mjs'
      - 'visual-lab/sidebar-session-ux-v123.mjs'
      - 'labs/project-memory-isolation-v133.mjs'
      - 'test/x.md'
      - '.github/workflows/project-memory-v132.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakgpt-project-memory-v132-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static Project Memory contract
        run: |
          node --check project-memory-background-v132.js
          node --check project-memory-v132.js
          node --check project-memory-ui-v132.js
          node tools/project-memory-v132.mjs
          node labs/project-memory-isolation-v133.mjs


  live-private-repo:
    needs: contract
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NIAKGPT_ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
      NIAKGPT_PRIVATE_REPO: niakw/niakgpt-private
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve repository-scoped private memory token
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          let all={};
          try{all=JSON.parse(process.env.NIAKGPT_ALL_SECRETS_JSON||'{}')}catch{}
          const keys=Object.keys(all).filter(k=>k!=='GITHUB_TOKEN'&&all[k]);
          const exact=['NIAKGPT_PRIVATE_REPO_TOKEN','NIAKGPT_PRIVATE_TOKEN','NIAKGPT_GITHUB_TOKEN','NIAKGPT_MEMORY_TOKEN'];
          const key=exact.find(k=>all[k]) ||
            keys.find(k=>/^NIAKGPT.*(?:PRIVATE|MEMORY|GITHUB).*(?:TOKEN|PAT)$/i.test(k)) ||
            keys.find(k=>/(?:PRIVATE|MEMORY).*(?:TOKEN|PAT)$/i.test(k));
          if(!key){
            console.error('::error::No NiakGPT private-memory Repository secret is available to this workflow.');
            process.exit(1);
          }
          const token=String(all[key]||'').trim();
          if(!token){console.error('::error::Resolved private-memory Repository secret is empty.');process.exit(1);}
          console.log('::add-mask::'+token);
          fs.appendFileSync(process.env.GITHUB_ENV,'NIAKGPT_PRIVATE_REPO_TOKEN<<NIAKGPT_EOF\n'+token+'\nNIAKGPT_EOF\n');
          console.log('Private-memory Repository secret resolved without exposing its name or value.');
          NODE
      - name: Live private Project Memory smoke
        run: node tools/project-memory-live-smoke-v133.mjs

  browser:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - name: Install Visual Lab
        working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - name: Private memory UX / synchronous context restore
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER: ${{ matrix.browser }}
        run: node project-memory-v132.mjs

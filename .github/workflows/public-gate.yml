name: NiakGPT Public Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - '*.js'
      - '*.css'
      - 'tools/**'
      - 'visual-lab/**'
      - 'labs/**'
      - 'README.md'
      - 'README.fr.md'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'TESTING_TRUTH.md'
      - 'TROUBLESHOOTING.md'
      - 'CHANGELOG.md'
      - 'RELEASE_NOTES_*.md'
      - 'HOTFIX_NOTES_*.md'
      - '.github/workflows/public-gate.yml'
  pull_request:
    paths:
      - 'manifest.json'
      - '*.js'
      - '*.css'
      - 'tools/**'
      - 'visual-lab/**'
      - 'labs/**'
      - 'README.md'
      - 'README.fr.md'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'TESTING_TRUTH.md'
      - 'TROUBLESHOOTING.md'
      - 'CHANGELOG.md'
      - 'RELEASE_NOTES_*.md'
      - 'HOTFIX_NOTES_*.md'
      - '.github/workflows/public-gate.yml'

permissions:
  contents: read

concurrency:
  group: niakgpt-public-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json

      - name: Capture tested commit
        run: echo "NIAKGPT_TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate runtime, hot-path and repository invariants
        run: |
          node tools/check-runtime.mjs
          node tools/check-hotpath-v096.mjs
          node tools/check-repository-hygiene.mjs
          node tools/check-fixture-privacy-v133.mjs
          node tools/project-memory-v132.mjs

      - name: Check JavaScript syntax from manifest
        run: |
          node - <<'NODE' > /tmp/niakgpt-js.txt
          const m=require('./manifest.json');
          const files=new Set(m.content_scripts.flatMap(x=>x.js||[]));
          if(m.background?.service_worker)files.add(m.background.service_worker);
          console.log([...files].join('\n'));
          NODE
          while IFS= read -r file; do
            test -n "$file" && node --check "$file"
          done < /tmp/niakgpt-js.txt

      - name: Install Visual Lab
        working-directory: visual-lab
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for release-critical field checks
        working-directory: visual-lab
        run: npx playwright install --with-deps chromium

      - name: Release-critical field regressions
        working-directory: visual-lab
        env:
          NIAKGPT_BROWSER: chromium
        run: |
          node hydration-barrier-v080.mjs
          node dom-node-stability-v082.mjs
          node pins-primary-slot-v083.mjs
          node pins-late-hydration-v084.mjs
          node pins-launcher-only-v085.mjs
          node native-priority-network-v085.mjs
          node native-chat-zero-background-v087.mjs
          node field-regressions-v088.mjs
          node project-memory-ui-stability-v084.mjs
          node project-memory-wake-v086.mjs
          npx playwright test tests/runtime-current-v105.spec.js tests/multitab-failover-v097.spec.js --workers=1 --reporter=line

      - name: Build clean installable ZIP
        run: node tools/package-extension.mjs

      - name: Verify installable ZIP
        run: |
          ZIP=$(find dist -maxdepth 1 -name 'niakgpt-*.zip' -print -quit)
          test -n "$ZIP"
          unzip -Z1 "$ZIP" > /tmp/niakgpt-public-package-files.txt
          grep -qx 'manifest.json' /tmp/niakgpt-public-package-files.txt
          grep -qx 'background-v100.js' /tmp/niakgpt-public-package-files.txt
          grep -qx 'README.md' /tmp/niakgpt-public-package-files.txt
          grep -qx 'README.fr.md' /tmp/niakgpt-public-package-files.txt
          unzip -p "$ZIP" manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=JSON.parse(s);if(m.background?.service_worker!=='background-v100.js')process.exit(1);})"
          for forbidden in 'app-v08-safe.js' 'project-governance-v085.js' 'project-pins-v085.js' 'multitab-v083.js' 'chronology-v081.js' 'polish-v081.js' 'onboarding-v100.js'; do
            if grep -Fxq "$forbidden" /tmp/niakgpt-public-package-files.txt; then
              echo "Legacy runtime leaked into ZIP: $forbidden"
              exit 1
            fi
          done
          if grep -E '(^|/)visual-lab(/|$)|(^|/)labs(/|$)|(^|/)tools(/|$)' /tmp/niakgpt-public-package-files.txt; then
            echo 'Development files leaked into installable ZIP'
            exit 1
          fi

      - name: Generate immutable certification record
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          cat > dist/QUALITY_GATE.json <<EOF
          {
            "status": "passed",
            "version": "$VERSION",
            "tested_commit": "$NIAKGPT_TESTED_SHA",
            "workflow_run": "$GITHUB_RUN_ID",
            "validated": [
              "runtime-invariants",
              "hot-path-invariants",
              "javascript-syntax",
              "field-regressions-v088",
              "native-chat-zero-backend",
              "project-memory-cache-bootstrap",
              "sidebar-dom-stability",
              "clean-installable-package"
            ],
            "dedicated_cross_platform_workflows_required": true
          }
          EOF

      - name: Upload certified package and QA report
        uses: actions/upload-artifact@v4
        with:
          name: niakgpt-public-gate-${{ github.sha }}
          path: |
            dist/niakgpt-*.zip
            dist/QUALITY_GATE.json
            visual-lab/artifacts
            visual-lab/playwright-report
            visual-lab/test-results
          if-no-files-found: error
          retention-days: 30

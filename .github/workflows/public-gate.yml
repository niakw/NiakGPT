name: NiakGPT Public Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - '*.js'
      - '*.css'
      - 'tools/**'
      - 'visual-lab/**'
      - 'labs/**'
      - 'README.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - '.github/workflows/public-gate.yml'
  pull_request:
    paths:
      - 'manifest.json'
      - '*.js'
      - '*.css'
      - 'tools/**'
      - 'visual-lab/**'
      - 'labs/**'
      - 'README.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - '.github/workflows/public-gate.yml'

permissions:
  contents: read

concurrency:
  group: niakgpt-public-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json

      - name: Capture tested commit
        run: echo "NIAKGPT_TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate current runtime and hot-path invariants
        run: |
          node tools/check-runtime.mjs
          node tools/check-hotpath-v096.mjs

      - name: Check all current root JavaScript syntax
        run: find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify current manifest/bootstrap references
        run: |
          node <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          for(const entry of manifest.content_scripts||[]) for(const file of [...(entry.js||[]),...(entry.css||[])]) if(!fs.existsSync(file)) throw new Error(`missing manifest file ${file}`);
          const background=fs.readFileSync('background-v100.js','utf8');
          const main=(background.match(/const\s+MAIN_RUNTIME\s*=\s*\[(.*?)\];/s)||[])[1]||'';
          const mainFiles=[...main.matchAll(/["']([^"']+\.js)["']/g)].map(x=>x[1]);
          if(JSON.stringify(mainFiles)!==JSON.stringify(['page-bridge.js'])) throw new Error(`unsafe MAIN runtime: ${mainFiles.join(', ')}`);
          if(background.includes("'hotcache-main-v084.js'")||background.includes("'activity-main-v087.js'")) throw new Error('retired MAIN interceptor returned');
          if(!background.includes("'runtime-integrity-v101.js'")) throw new Error('runtime integrity module missing');
          const isolated=(background.match(/const\s+ISOLATED_RUNTIME\s*=\s*\[(.*?)\];/s)||[])[1]||'';
          for(const file of [...isolated.matchAll(/["']([^"']+\.js)["']/g)].map(x=>x[1])) if(!fs.existsSync(file)) throw new Error(`missing injected file ${file}`);
          if(JSON.stringify(manifest).includes('style.css')) throw new Error('unexpected style.css reference');
          console.log('CURRENT_BOOTSTRAP_REFERENCES_PASS');
          NODE

      - name: Install Visual Lab
        working-directory: visual-lab
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: visual-lab
        run: npx playwright install --with-deps chromium

      - name: Run full current visual and real unpacked-extension tests
        working-directory: visual-lab
        run: npm run test:current

      - name: Build clean installable ZIP
        run: node tools/package-extension.mjs

      - name: Verify installable ZIP
        run: |
          ZIP=$(find dist -maxdepth 1 -name 'niakgpt-*.zip' -print -quit)
          test -n "$ZIP"
          unzip -Z1 "$ZIP" > /tmp/niakgpt-public-package-files.txt
          grep -qx 'manifest.json' /tmp/niakgpt-public-package-files.txt
          grep -qx 'background-v100.js' /tmp/niakgpt-public-package-files.txt
          grep -qx 'runtime-integrity-v101.js' /tmp/niakgpt-public-package-files.txt
          unzip -p "$ZIP" manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=JSON.parse(s);if(m.background?.service_worker!=='background-v100.js')process.exit(1);})"
          for forbidden in 'hotcache-main-v084.js' 'hotcache-ui-v097.js' 'hotcache-v084.js' 'activity-main-v087.js' 'app-v08-safe.js' 'project-governance-v085.js' 'project-pins-v085.js' 'multitab-v083.js' 'chronology-v081.js' 'polish-v081.js' 'onboarding-v100.js'; do
            if grep -Fxq "$forbidden" /tmp/niakgpt-public-package-files.txt; then
              echo "Retired runtime leaked into ZIP: $forbidden"
              exit 1
            fi
          done
          if grep -E '(^|/)visual-lab(/|$)|(^|/)labs(/|$)|(^|/)tools(/|$)' /tmp/niakgpt-public-package-files.txt; then
            echo 'Development files leaked into installable ZIP'
            exit 1
          fi

      - name: Generate immutable certification record
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          cat > dist/QUALITY_GATE.json <<EOF
          {
            "status": "passed",
            "version": "$VERSION",
            "tested_commit": "$NIAKGPT_TESTED_SHA",
            "workflow_run": "$GITHUB_RUN_ID",
            "validated": [
              "runtime-invariants",
              "hot-path-invariants",
              "javascript-syntax",
              "bootstrap-reference-integrity",
              "current-visual-lab-full-suite",
              "real-unpacked-extension",
              "runtime-integrity-repair",
              "retired-hotcache-absent",
              "clean-installable-package"
            ],
            "legacy_specs_retained": true
          }
          EOF

      - name: Upload certified package and QA report
        uses: actions/upload-artifact@v4
        with:
          name: niakgpt-public-gate-${{ github.sha }}
          path: |
            dist/niakgpt-*.zip
            dist/QUALITY_GATE.json
            visual-lab/artifacts
            visual-lab/playwright-report
            visual-lab/test-results
          if-no-files-found: error
          retention-days: 30

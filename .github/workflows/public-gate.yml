name: NiakGPT Public Quality Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - '*.js'
      - '*.css'
      - 'tools/**'
      - 'visual-lab/**'
      - 'README.md'
      - 'PRIVACY.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - '.github/workflows/public-gate.yml'

permissions:
  contents: read

concurrency:
  group: niakgpt-public-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json

      - name: Capture tested commit
        run: echo "NIAKGPT_TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate runtime and hot-path invariants
        run: |
          node tools/check-runtime.mjs
          node tools/check-hotpath-v096.mjs

      - name: Check JavaScript syntax from manifest
        run: |
          node - <<'NODE' > /tmp/niakgpt-js.txt
          const m=require('./manifest.json');
          const files=new Set(m.content_scripts.flatMap(x=>x.js||[]));
          if(m.background?.service_worker)files.add(m.background.service_worker);
          console.log([...files].join('\n'));
          NODE
          while IFS= read -r file; do
            test -n "$file" && node --check "$file"
          done < /tmp/niakgpt-js.txt

      - name: Install Visual Lab
        working-directory: visual-lab
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: visual-lab
        run: npx playwright install --with-deps chromium

      - name: Run visual and real unpacked-extension tests
        working-directory: visual-lab
        run: npm test

      - name: Build clean installable ZIP
        run: node tools/package-extension.mjs

      - name: Verify installable ZIP
        run: |
          ZIP=$(find dist -maxdepth 1 -name 'niakgpt-*.zip' -print -quit)
          test -n "$ZIP"
          unzip -l "$ZIP" | grep -q 'manifest.json'
          unzip -l "$ZIP" | grep -q 'background-v100.js'
          unzip -p "$ZIP" manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=JSON.parse(s);if(m.background?.service_worker!=='background-v100.js')process.exit(1);})"
          if unzip -l "$ZIP" | grep -E 'visual-lab|tools/|app-v08-safe|project-governance-v085.js|project-pins-v085.js|multitab-v083.js|chronology-v081.js|polish-v081.js|onboarding-v100.js'; then
            echo 'Development or legacy files leaked into installable ZIP'
            exit 1
          fi

      - name: Generate immutable certification record
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          cat > dist/QUALITY_GATE.json <<EOF
          {
            "status": "passed",
            "version": "$VERSION",
            "tested_commit": "$NIAKGPT_TESTED_SHA",
            "workflow_run": "$GITHUB_RUN_ID",
            "validated": [
              "runtime-invariants",
              "hot-path-invariants",
              "javascript-syntax",
              "visual-lab",
              "real-unpacked-extension",
              "hot-conversation-cache",
              "clean-installable-package"
            ]
          }
          EOF

      - name: Upload certified package and QA report
        uses: actions/upload-artifact@v4
        with:
          name: niakgpt-public-gate-${{ github.sha }}
          path: |
            dist/niakgpt-*.zip
            dist/QUALITY_GATE.json
            visual-lab/artifacts
            visual-lab/playwright-report
            visual-lab/test-results
          if-no-files-found: error
          retention-days: 30

name: Purge GitHub Actions history

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PURGE ACTIONS to confirm"
        required: true
        type: string
      mode:
        description: "logs = keep run history/artifacts; runs = delete completed runs and artifacts"
        required: true
        default: runs
        type: choice
        options:
          - logs
          - runs
      batch_size:
        description: "Completed runs processed per pass (max 800)"
        required: true
        default: "800"
        type: string
      before:
        description: "Internal continuation cursor; leave empty"
        required: false
        default: ""
        type: string
      final_pass:
        description: "Internal cleanup pass; leave disabled"
        required: false
        default: false
        type: boolean
      auto_continue:
        description: "Continue automatically until the selected history is traversed"
        required: true
        default: true
        type: boolean
  schedule:
    # Weekly maintenance: Sunday 04:11 UTC. Scheduled mode keeps the latest 7 days.
    - cron: "11 4 * * 0"

permissions:
  actions: write
  contents: read

concurrency:
  group: niakgpt-purge-github-actions
  cancel-in-progress: false

jobs:
  purge:
    if: ${{ github.event_name == 'schedule' || inputs.confirm == 'PURGE ACTIONS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
      PURGE_MODE: ${{ github.event_name == 'schedule' && 'runs' || inputs.mode }}
      BATCH_SIZE: ${{ github.event_name == 'schedule' && '800' || inputs.batch_size }}
      BEFORE_CURSOR: ${{ inputs.before || '' }}
      FINAL_PASS: ${{ inputs.final_pass || false }}
      AUTO_CONTINUE: ${{ github.event_name == 'schedule' && 'true' || inputs.auto_continue }}
      AUTO_RETENTION_DAYS: "7"
    steps:
      - name: Purge completed Actions history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_run = int(os.environ["GITHUB_RUN_ID"])
          mode = os.environ.get("PURGE_MODE", "runs").strip()
          before = os.environ.get("BEFORE_CURSOR", "").strip()
          final_pass = os.environ.get("FINAL_PASS", "false").lower() == "true"
          auto_continue = os.environ.get("AUTO_CONTINUE", "true").lower() == "true"
          scheduled = os.environ.get("IS_SCHEDULED", "false").lower() == "true"

          try:
              retention_days = int(os.environ.get("AUTO_RETENTION_DAYS", "7"))
              batch_size = int(os.environ.get("BATCH_SIZE", "800"))
          except ValueError as exc:
              raise SystemExit(f"invalid numeric input: {exc}")

          if retention_days < 1:
              raise SystemExit("AUTO_RETENTION_DAYS must be >= 1")
          if not 1 <= batch_size <= 800:
              raise SystemExit("batch_size must be between 1 and 800")
          if mode not in {"logs", "runs"}:
              raise SystemExit(f"unsupported purge mode: {mode}")

          if scheduled and not before and not final_pass:
              cutoff = dt.datetime.now(dt.timezone.utc) - dt.timedelta(days=retention_days)
              before = cutoff.strftime("%Y-%m-%dT%H:%M:%SZ")
              print(
                  f"Weekly purge: deleting completed runs older than {retention_days} days "
                  f"(cutoff {before}).",
                  flush=True,
              )

          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "NiakGPT-actions-purge",
          }

          def request(path, method="GET", payload=None, retry=True):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      body = response.read()
                      parsed = json.loads(body) if body else {}
                      return response.status, parsed, dict(response.headers)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  remaining = int(exc.headers.get("x-ratelimit-remaining", "1") or "1")
                  retry_after = exc.headers.get("retry-after")
                  if retry and (remaining == 0 or retry_after):
                      if retry_after:
                          wait = int(retry_after) + 2
                      else:
                          reset = int(exc.headers.get("x-ratelimit-reset", "0") or "0")
                          wait = max(2, reset - int(time.time()) + 3)
                      print(f"Rate limit reached; sleeping {wait}s.", flush=True)
                      time.sleep(wait)
                      return request(path, method=method, payload=payload, retry=False)
                  if exc.code == 404:
                      return 404, {"message": body}, dict(exc.headers)
                  print(f"GitHub API error {exc.code} {method} {path}: {body}", file=sys.stderr)
                  raise

          def rate_limit_guard(required):
              _, data, _ = request("/rate_limit")
              core = data.get("resources", {}).get("core", {})
              remaining = int(core.get("remaining") or 0)
              reset = int(core.get("reset") or 0)
              if remaining >= required:
                  return
              wait = max(2, reset - int(time.time()) + 3)
              print(f"Only {remaining} API requests remain; sleeping {wait}s.", flush=True)
              time.sleep(wait)

          def list_completed(limit, cursor=""):
              rows = []
              page = 1
              while len(rows) < limit:
                  params = {"status": "completed", "per_page": "100", "page": str(page)}
                  if cursor:
                      params["created"] = f"<{cursor}"
                  _, payload, _ = request(
                      f"/repos/{repo}/actions/runs?{urllib.parse.urlencode(params)}"
                  )
                  batch = payload.get("workflow_runs") or []
                  if not batch:
                      break
                  for run in batch:
                      if int(run.get("id") or 0) == current_run:
                          continue
                      rows.append(run)
                      if len(rows) >= limit:
                          break
                  if len(batch) < 100:
                      break
                  page += 1
              return rows

          def list_purge_workflow_runs():
              rows = []
              page = 1
              while True:
                  query = urllib.parse.urlencode(
                      {"status": "completed", "per_page": "100", "page": str(page)}
                  )
                  _, payload, _ = request(
                      f"/repos/{repo}/actions/workflows/purge-actions-history.yml/runs?{query}"
                  )
                  batch = payload.get("workflow_runs") or []
                  if not batch:
                      break
                  rows.extend(run for run in batch if int(run.get("id") or 0) != current_run)
                  if len(batch) < 100:
                      break
                  page += 1
              return rows

          rows = list_purge_workflow_runs() if final_pass else list_completed(batch_size, before)

          if not rows:
              print("No completed workflow runs remain for this traversal.")
              raise SystemExit(0)

          rate_limit_guard(min(950, len(rows) + 30))

          deleted = absent = failed = 0
          for index, run in enumerate(rows, start=1):
              run_id = int(run["id"])
              endpoint = (
                  f"/repos/{repo}/actions/runs/{run_id}"
                  if mode == "runs"
                  else f"/repos/{repo}/actions/runs/{run_id}/logs"
              )
              status, _, _ = request(endpoint, method="DELETE")
              if status == 204:
                  deleted += 1
              elif status == 404:
                  absent += 1
              else:
                  failed += 1
              if index % 50 == 0:
                  print(
                      f"Processed {index}/{len(rows)}: deleted={deleted} "
                      f"already_absent={absent} failed={failed}",
                      flush=True,
                  )
              time.sleep(0.08)

          print(
              f"PURGE_RESULT mode={mode} processed={len(rows)} deleted={deleted} "
              f"already_absent={absent} failed={failed}"
          )
          if failed:
              raise SystemExit(f"{failed} deletion(s) failed")

          if final_pass:
              print(
                  "Self-history cleanup complete. The currently running purge job "
                  "remains until the next purge execution."
              )
              raise SystemExit(0)

          oldest = min(str(run.get("created_at") or "") for run in rows if run.get("created_at"))
          if not oldest:
              raise SystemExit("unable to derive continuation cursor")

          if len(rows) >= batch_size and auto_continue:
              stamp = dt.datetime.fromisoformat(oldest.replace("Z", "+00:00"))
              next_cursor = (stamp + dt.timedelta(seconds=1)).strftime("%Y-%m-%dT%H:%M:%SZ")
              payload = {
                  "ref": "main",
                  "inputs": {
                      "confirm": "PURGE ACTIONS",
                      "mode": mode,
                      "batch_size": str(batch_size),
                      "before": next_cursor,
                      "final_pass": "false",
                      "auto_continue": "true",
                  },
              }
              request(
                  f"/repos/{repo}/actions/workflows/purge-actions-history.yml/dispatches",
                  method="POST",
                  payload=payload,
              )
              print(f"Continuation dispatched before {next_cursor}.")
          elif auto_continue:
              payload = {
                  "ref": "main",
                  "inputs": {
                      "confirm": "PURGE ACTIONS",
                      "mode": "logs",
                      "batch_size": "800",
                      "before": "",
                      "final_pass": "true",
                      "auto_continue": "false",
                  },
              }
              request(
                  f"/repos/{repo}/actions/workflows/purge-actions-history.yml/dispatches",
                  method="POST",
                  payload=payload,
              )
              print("Final cleanup pass dispatched.")
          PY

name: NiakGPT 0.9.53 Regression Matrix

on:
  push:
    branches:
      - main
    paths:
      - '*.js'
      - '*.css'
      - 'manifest.json'
      - 'labs/**'
      - '.github/workflows/regression-matrix-0953.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.css'
      - 'manifest.json'
      - 'labs/**'
      - '.github/workflows/regression-matrix-0953.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakgpt-0953-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: 0.9.53+ historical · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify compatible 0.9.53+ runtime
        run: |
          python - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          v=tuple(int(x) for x in m['version'].split('.'))
          assert v >= (0,9,53), f"0.9.53 historical matrix refuses older source {m['version']}"
          PY
          grep -q "browser-compat-v102.js" background-v100.js
          grep -q 'project-state-selfheal-v102.js' background-v100.js
          grep -q 'project-assignment-selfheal-v103.js' background-v100.js
          grep -q 'cacheProjectIds' project-pins-v090.js
          grep -q 'repairGovernance' project-state-selfheal-v102.js
          grep -q 'localToCanonical' project-assignment-selfheal-v103.js
          grep -q 'contextDead' multitab-v090.js
          grep -qi 'extension context invalidated' cache-bus-v096.js
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run Project-state + lifecycle regressions in production load order
        id: regression
        env:
          NIAKGPT_ROOT: ${{ github.workspace }}
        run: python labs/regression_0953_v2.py --browser ${{ matrix.browser }}
      - name: Verify chat assignments survive Project ID self-heal
        env:
          NIAKGPT_ROOT: ${{ github.workspace }}
        run: python labs/project_assignment_0953.py --browser ${{ matrix.browser }}
      - name: Verify native activity UI signals
        env:
          NIAKGPT_ROOT: ${{ github.workspace }}
        run: python labs/activity_regression_0953.py --browser ${{ matrix.browser }}
      - name: Visual proof of Project recovery
        env:
          NIAKGPT_ROOT: ${{ github.workspace }}
          NIAKGPT_ARTIFACTS: ${{ runner.temp }}/niakgpt-0953-project-recovery/${{ matrix.browser }}
        run: python labs/visual_project_recovery_0953.py --browser ${{ matrix.browser }}
      - name: Upload 0.9.53 Project recovery screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niakgpt-0953-project-recovery-${{ matrix.browser }}
          path: ${{ runner.temp }}/niakgpt-0953-project-recovery/${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 30
      - name: Dump lifecycle diagnostics on failure
        if: failure() && steps.regression.outcome == 'failure'
        env:
          NIAKGPT_ROOT: ${{ github.workspace }}
        run: python labs/lifecycle_debug_0953_v2.py --browser ${{ matrix.browser }}

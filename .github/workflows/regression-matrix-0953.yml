name: NiakGPT 0.9.53 Regression Matrix

on:
  push:
    branches:
      - main
    paths:
      - '*.js'
      - '*.css'
      - 'manifest.json'
      - 'labs/**'
      - '.github/workflows/regression-matrix-0953.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.css'
      - 'manifest.json'
      - 'labs/**'
      - '.github/workflows/regression-matrix-0953.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakgpt-0953-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: 0.9.53 · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 0.9.53 runtime
        run: |
          python - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          assert m['version']=='0.9.53', f"0.9.53 matrix refuses source {m['version']}"
          PY
          grep -q 'project-state-selfheal-v102.js' background-v100.js
          grep -q 'cacheProjectIds' project-pins-v090.js
          grep -q 'repairGovernance' project-state-selfheal-v102.js
          grep -q 'contextDead' multitab-v090.js
          grep -qi 'extension context invalidated' cache-bus-v096.js
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run Project-state + lifecycle regressions
        env:
          NIAKGPT_ROOT: ${{ github.workspace }}
        run: python labs/regression_0953.py --browser ${{ matrix.browser }}

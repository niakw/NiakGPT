name: NiakGPT 0.9.55+ Governance Matrix

on:
  push:
    branches: [main]
    paths:
      - 'governance-adapter-v105.js'
      - 'project-governance-v090.js'
      - 'background-v100.js'
      - 'manifest.json'
      - 'labs/governance_regression_0955.py'
      - '.github/workflows/regression-matrix-0955.yml'
  pull_request:
    paths:
      - 'governance-adapter-v105.js'
      - 'project-governance-v090.js'
      - 'background-v100.js'
      - 'manifest.json'
      - 'labs/governance_regression_0955.py'
      - '.github/workflows/regression-matrix-0955.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakgpt-0955-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: 0.9.55+ governance · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify compatible 0.9.55+ wiring
        run: |
          python - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          v=tuple(int(x) for x in m['version'].split('.'))
          assert v >= (0,9,55), f"0.9.55 governance matrix refuses older source {m['version']}"
          PY
          grep -q "governance-adapter-v105.js" background-v100.js
          ! grep -q "'manual-lock-main-v085.js'" background-v100.js
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify trusted manual moves and lightweight governance checks
        run: python labs/governance_regression_0955.py --browser ${{ matrix.browser }}

name: NiakGPT 0.9.56 Live Matrix

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.css'
      - 'manifest.json'
      - 'labs/live_regression_0956.py'
      - '.github/workflows/regression-matrix-0956.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.css'
      - 'manifest.json'
      - 'labs/live_regression_0956.py'
      - '.github/workflows/regression-matrix-0956.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakgpt-0956-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: 0.9.56 live · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 0.9.56 wiring
        run: |
          python - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          assert m['version']=='0.9.56', m['version']
          PY
          grep -q "live-fixes-v106.js" background-v100.js
          grep -q "project-links-v106.js" background-v100.js
          grep -q "<a data-chat=" pin-folders-v096.js
          grep -q "href='/projects'" project-links-v106.js
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Reproduce sidebar race, Project context and link semantics
        run: python labs/live_regression_0956.py --browser ${{ matrix.browser }} --screenshot "${{ runner.temp }}/live-0956/${{ matrix.browser }}/live-0956-${{ matrix.browser }}.png"
      - name: Upload 0.9.56 visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niakgpt-0956-live-${{ matrix.browser }}
          path: ${{ runner.temp }}/live-0956/${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 30

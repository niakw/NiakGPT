name: NiakGPT 0.9.57 Sidebar Matrix

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - '*.css'
      - 'manifest.json'
      - 'labs/live_regression_0957.py'
      - '.github/workflows/regression-matrix-0957.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.css'
      - 'manifest.json'
      - 'labs/live_regression_0957.py'
      - '.github/workflows/regression-matrix-0957.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakgpt-0957-sidebar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sidebar:
    name: 0.9.57 sidebar · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 0.9.57 wiring
        run: |
          python - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          assert m['version']=='0.9.57', m['version']
          css=[x for cs in m['content_scripts'] for x in cs.get('css',[])]
          assert 'sidebar-authority-v107.css' in css
          PY
          grep -q "sidebar-authority-v107.js" background-v100.js
          grep -q "sidebar-authority-v107.css" manifest.json
          grep -q "ng107-native-project-cluster" sidebar-authority-v107.js
          grep -q "dateGhostProjectNotCleaned" labs/live_regression_0957.py
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Reproduce native Project duplicates and date metadata corruption
        run: python labs/live_regression_0957.py --browser ${{ matrix.browser }} --screenshot "${{ runner.temp }}/live-0957/${{ matrix.browser }}/live-0957-${{ matrix.browser }}.png"
      - name: Upload 0.9.57 visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niakgpt-0957-sidebar-${{ matrix.browser }}
          path: ${{ runner.temp }}/live-0957/${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 30

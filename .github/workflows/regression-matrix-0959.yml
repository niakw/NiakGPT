name: NiakGPT 0.9.59 Historical Regression Matrix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: 0.9.59 historical · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify historical 0.9.59 fixtures exist
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['sidebar-projects-authority-v109.js','sidebar-projects-authority-v109.css','project-chat-ux-v109.js','project-chat-ux-v109.css','labs/regression_0959.py']:
              assert Path(name).exists(), name
          PY
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run historical regression
        run: python labs/regression_0959.py --browser ${{ matrix.browser }}

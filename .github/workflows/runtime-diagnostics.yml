name: NiakGPT Runtime Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakgpt-runtime-diagnostics-${{ github.ref }}
  cancel-in-progress: true

# Diagnostic-only workflow: run manually when one runtime family needs isolated troubleshooting.
jobs:
  runtime-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - working-directory: visual-lab
        run: npx playwright install --with-deps chromium
      - working-directory: visual-lab
        run: npx playwright test tests/runtime-extension.spec.js --workers=1 --reporter=line

  hotcache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - working-directory: visual-lab
        run: npx playwright install --with-deps chromium
      - working-directory: visual-lab
        run: npx playwright test tests/hotcache-runtime.spec.js tests/hotcache-concurrency-v096.spec.js --workers=1 --reporter=line

  multitab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - working-directory: visual-lab
        run: npx playwright install --with-deps chromium
      - working-directory: visual-lab
        run: npx playwright test tests/multitab-failover-v097.spec.js --workers=1 --reporter=line

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - working-directory: visual-lab
        run: npx playwright install --with-deps chromium
      - working-directory: visual-lab
        run: npx playwright test tests/audit-v096.spec.js --workers=1 --reporter=line

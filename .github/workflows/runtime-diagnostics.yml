name: NiakGPT Runtime Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-diagnostics.yml'
      - 'activity-ui-v097.js'
      - 'hotcache-main-v084.js'
      - 'diagnostic-bus-v096.js'
      - 'app-v090.js'
      - 'manifest.json'
      - 'visual-lab/tests/runtime-extension.spec.js'
      - 'visual-lab/tests/hotcache-runtime.spec.js'
      - 'visual-lab/tests/hotcache-concurrency-v096.spec.js'
      - 'visual-lab/tests/multitab-failover-v097.spec.js'
      - 'visual-lab/tests/audit-v096.spec.js'

permissions:
  contents: read

concurrency:
  group: niakgpt-runtime-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - working-directory: visual-lab
        run: npx playwright install --with-deps chromium
      - working-directory: visual-lab
        run: npx playwright test tests/runtime-extension.spec.js --workers=1 --reporter=line

  hotcache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - working-directory: visual-lab
        run: npx playwright install --with-deps chromium
      - working-directory: visual-lab
        run: npx playwright test tests/hotcache-runtime.spec.js tests/hotcache-concurrency-v096.spec.js --workers=1 --reporter=line

  multitab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - working-directory: visual-lab
        run: npx playwright install --with-deps chromium
      - working-directory: visual-lab
        run: npx playwright test tests/multitab-failover-v097.spec.js --workers=1 --reporter=line

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - working-directory: visual-lab
        run: npx playwright install --with-deps chromium
      - working-directory: visual-lab
        run: npx playwright test tests/audit-v096.spec.js --workers=1 --reporter=line

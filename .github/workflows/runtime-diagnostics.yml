name: NiakGPT Runtime Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-diagnostics.yml'
      - 'activity-ui-v097.js'
      - 'governance-adapter-v105.js'
      - 'project-governance-v090.js'
      - 'lifecycle-guard-v104.js'
      - 'cache-bus-v096.js'
      - 'multitab-v090.js'
      - 'diagnostic-bus-v096.js'
      - 'app-v090.js'
      - 'page-bridge.js'
      - 'background-v100.js'
      - 'manifest.json'
      - 'sidebar-projects-authority-v110.js'
      - 'project-folders-v110.js'
      - 'continuity-out-cache-v110.js'
      - 'control-a11y-v110.js'
      - 'tools/check-runtime.mjs'
      - 'tools/check-hydration-v110.mjs'
      - 'tools/check-hotpath-v096.mjs'
      - 'tools/package-extension.mjs'
      - 'visual-lab/tests/runtime-current-v105.spec.js'
      - 'visual-lab/tests/multitab-failover-v097.spec.js'
      - 'visual-lab/tests/project-stability-v0960.spec.js'
  pull_request:
    paths:
      - '.github/workflows/runtime-diagnostics.yml'
      - 'activity-ui-v097.js'
      - 'governance-adapter-v105.js'
      - 'project-governance-v090.js'
      - 'lifecycle-guard-v104.js'
      - 'cache-bus-v096.js'
      - 'multitab-v090.js'
      - 'diagnostic-bus-v096.js'
      - 'app-v090.js'
      - 'page-bridge.js'
      - 'background-v100.js'
      - 'manifest.json'
      - 'sidebar-projects-authority-v110.js'
      - 'project-folders-v110.js'
      - 'continuity-out-cache-v110.js'
      - 'control-a11y-v110.js'
      - 'tools/check-runtime.mjs'
      - 'tools/check-hydration-v110.mjs'
      - 'tools/check-hotpath-v096.mjs'
      - 'tools/package-extension.mjs'
      - 'visual-lab/tests/runtime-current-v105.spec.js'
      - 'visual-lab/tests/multitab-failover-v097.spec.js'
      - 'visual-lab/tests/project-stability-v0960.spec.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: niakgpt-runtime-diagnostics-${{ github.ref }}
  cancel-in-progress: true

# Current runtime diagnostics. Historical hotcache/audit files remain in the repository,
# but are not release gates because the full-conversation hotcache and old coach UI were
# intentionally removed from the production architecture.
jobs:
  runtime-current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - working-directory: visual-lab
        run: npx playwright install --with-deps chromium
      - working-directory: visual-lab
        run: npx playwright test tests/runtime-current-v105.spec.js tests/project-stability-v0960.spec.js --workers=1 --reporter=line

  multitab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - working-directory: visual-lab
        run: npm ci --no-audit --no-fund
      - working-directory: visual-lab
        run: npx playwright install --with-deps chromium
      - working-directory: visual-lab
        run: npx playwright test tests/multitab-failover-v097.spec.js --workers=1 --reporter=line

  static-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check runtime JavaScript
        run: |
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify hydration, hot path and governance architecture
        run: |
          node tools/check-runtime.mjs
          node tools/check-hotpath-v096.mjs
      - name: Verify installable package
        run: |
          node tools/package-extension.mjs
          unzip -t "dist/niakgpt-$(node -p "require('./manifest.json').version").zip"

name: Sync NiakGPT 0.9.52 Canonical Runtime

on:
  push:
    branches:
      - agent/niakgpt-0952-source-final-2
    paths:
      - 'labs/source-0952-final/**'
      - '.github/workflows/sync-0952-canonical.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niakgpt-0952-canonical-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Rebuild exact 0.9.52 critical source
        run: |
          cat labs/source-0952-final/part-* > /tmp/niakgpt-0952-critical.b64
          base64 -d /tmp/niakgpt-0952-critical.b64 > /tmp/niakgpt-0952-critical.tgz
          echo 'b8e1c8eae7df32318fc914bfb3858462f64089623ea1dd050760c3168be21473  /tmp/niakgpt-0952-critical.tgz' | sha256sum -c -
          tar -xzf /tmp/niakgpt-0952-critical.tgz -C .
          python - <<'PY'
          import json
          assert json.load(open('manifest.json'))['version'] == '0.9.52'
          PY
      - name: Commit canonical runtime files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json app-v090.js core-v090.css side-panels-v096.js side-panels-v096.css continuity-v100.js activity-ui-v097.js page-bridge.js server-index-v100.js reclassify-v101.js recovery-v100.js visual-stability-v101.css visual-stability-v101.js coach-v101.js README.md CHANGELOG.md PRIVACY.md SECURITY.md
          if git diff --cached --quiet; then
            echo 'Canonical 0.9.52 runtime already synchronized.'
            exit 0
          fi
          git commit -m 'Sync canonical NiakGPT 0.9.52 runtime'
          git push origin HEAD:${GITHUB_REF_NAME}

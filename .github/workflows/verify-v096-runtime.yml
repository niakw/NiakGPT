name: Verify NiakGPT 0.9.6 runtime convergence

on:
  push:
    branches: [main]
    paths:
      - 'tools/verify-runtime-trigger-v096.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check active runtime
        run: |
          node - <<'NODE' > /tmp/runtime-js.txt
          const m=require('./manifest.json');
          const files=new Set(m.content_scripts.flatMap(x=>x.js||[]));
          if(m.background?.service_worker)files.add(m.background.service_worker);
          console.log([...files].join('\n'));
          NODE
          while IFS= read -r file; do
            test -n "$file" && node --check "$file"
          done < /tmp/runtime-js.txt

      - name: Verify final runtime invariants
        run: |
          test "$(node -p "require('./manifest.json').version")" = '0.9.6'
          grep -Fq 'function bindNavigation()' app-v090.js
          ! grep -Fq 'function routeTick()' app-v090.js
          ! grep -Fq 'function ensureCoach()' app-v090.js
          ! grep -Fq 'function suggestionSet(prompt)' app-v090.js
          ! grep -Fq 'niakgptCoordinatedRAF' multitab-v090.js
          grep -Fq 'function ensureMutableCache()' project-governance-v090.js
          grep -Fq 'const end=Math.min(index+20,nodes.length)' app-v090.js
          grep -Fq 'function saveCacheSoon(delay=1600)' app-v090.js
          grep -Fq 'incoming?.at===S.lastCacheWriteAt' app-v090.js
          grep -Fq "client?(mode==='normal'?360:700)" app-v090.js
          grep -Fq 'storeResponseAfterRender' hotcache-main-v084.js
          grep -Fq "if (clone) await storeResponseAfterRender(id, clone);" hotcache-main-v084.js
          grep -Fq 'let metaMirror = parseJSON' hotcache-main-v084.js
          grep -Fq '__NIAKGPT_CACHE_BUS__' app-v090.js
          grep -Fq '__NIAKGPT_CACHE_BUS__' chronology-v090.js
          grep -Fq '__NIAKGPT_CACHE_BUS__' pin-folders-v096.js
          grep -Fq '__NIAKGPT_CACHE_BUS__' project-governance-v090.js
          ! grep -Fq 'chrome.storage.local.get(CACHE_KEY)' chronology-v090.js
          ! grep -Fq 'chrome.storage.local.get(CACHE_KEY)' pin-folders-v096.js
          ! grep -Fq 'chrome.storage.local.get(CACHE_KEY)' project-governance-v090.js
          ! grep -Fq 'waitForPeer(' hotcache-main-v084.js
          ! grep -Fq 'WAIT_OTHER_TAB_MS' hotcache-main-v084.js
          ! grep -Fq "main.querySelectorAll('pre').forEach(decorateCode)" app-v090.js
          ! grep -Fq 'renderPins();decorateSidebar();' app-v090.js
          ! grep -Fq 'await saveCache();renderPins();renderPanel();' app-v090.js

      - name: Publish exact runtime marker
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION=$(node -p "require('./manifest.json').version")
          cat > RUNTIME_CONVERGED.json <<EOF
          {
            "status": "converged",
            "version": "$VERSION",
            "verified_commit": "$SHA",
            "verified_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RUNTIME_CONVERGED.json
          git commit -m "Mark NiakGPT 0.9.6 runtime convergence"
          git push origin HEAD:main

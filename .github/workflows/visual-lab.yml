name: NiakGPT Visual Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - '*.js'
      - '*.css'
      - 'visual-lab/**'
      - '.github/workflows/visual-lab.yml'
  pull_request:
    paths:
      - 'manifest.json'
      - '*.js'
      - '*.css'
      - 'visual-lab/**'
      - '.github/workflows/visual-lab.yml'

concurrency:
  group: niakgpt-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: visual-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-lab/package-lock.json
      - name: Install visual lab
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run current visual and unpacked-extension assertions
        run: npm run test:current
      - name: Upload visual screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niakgpt-visual-lab
          path: |
            visual-lab/artifacts
            visual-lab/playwright-report
            visual-lab/test-results
          if-no-files-found: warn
          retention-days: 14

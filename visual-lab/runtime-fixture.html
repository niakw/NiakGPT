<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChatGPT Runtime Lab</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#101010;color:#eee}header{height:48px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid #333}body{display:grid;grid-template-columns:260px 1fr;grid-template-rows:48px 1fr}header{grid-column:1/3}.sidebar{grid-row:2;padding:10px;overflow:auto;border-right:1px solid #333}.sidebar h3{font-size:11px;margin:14px 5px 6px}.sidebar a{display:block;position:relative;padding:8px;margin:2px 0;color:#ddd;text-decoration:none}.content{grid-row:2;padding:28px 12vw 160px;min-width:0}.turn{padding:14px;margin:12px 0;border:1px solid #333;border-radius:8px}.composer{position:fixed;left:340px;right:120px;bottom:50px;display:flex;gap:8px;background:#171717;padding:10px;border:1px solid #444;border-radius:14px}.composer textarea{flex:1;min-height:48px}.composer button{width:44px}.lab-native-actions{position:fixed;top:8px;right:80px;display:flex;gap:6px;z-index:3}
  </style>
</head>
<body>
  <header><span id="native-brand">ChatGPT Plus</span></header>
  <div class="lab-native-actions"><button id="lab-send-native">Simuler réponse</button><button id="lab-move-native">Déplacer natif</button></div>
  <nav class="sidebar" data-testid="conversation-sidebar">
    <h3>Projects</h3>
    <a data-sidebar-item="true" href="/g/g-p-aaaaaaaaaaaaaaaa/project">Studio</a>
    <a data-sidebar-item="true" href="/g/g-p-bbbbbbbbbbbbbbbb/project">Research Lab</a>
    <h3>Épinglés</h3>
    <a data-sidebar-item="true" href="/g/g-p-aaaaaaaaaaaaaaaa/project">Studio</a>
    <h3>Récents</h3>
    <a data-sidebar-item="true" href="/c/11111111-1111-4111-8111-111111111111">Runtime integration test</a>
    <a data-sidebar-item="true" href="/c/22222222-2222-4222-8222-222222222222">Second conversation</a>
    <a data-sidebar-item="true" href="/c/33333333-3333-4333-8333-333333333333">Research conversation</a>
  </nav>
  <main class="content">
    <article class="turn" data-testid="conversation-turn-1"><div data-message-author-role="user">Peux-tu tester NiakGPT sur un faux ChatGPT réel ?</div></article>
    <article class="turn" data-testid="conversation-turn-2"><div data-message-author-role="assistant">Oui. Cette fixture est volontairement minimale mais conserve les sélecteurs importants.</div></article>
    <form class="composer" data-type="unified-composer" onsubmit="return false">
      <textarea id="prompt-textarea" data-testid="prompt-textarea">Test runtime</textarea>
      <button type="button" id="native-send" data-testid="send-button" aria-label="Envoyer">↑</button>
    </form>
  </main>
  <script>
    const CURRENT='11111111-1111-4111-8111-111111111111';
    const TARGET='g-p-bbbbbbbbbbbbbbbb';
    window.labSend=()=>{fetch('/backend-api/conversation',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({conversation_id:CURRENT,messages:[{id:crypto.randomUUID(),author:{role:'user'},content:{content_type:'text',parts:['runtime']}}]})}).catch(()=>{});};
    window.labMove=()=>fetch(`/backend-api/conversation/${CURRENT}`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({gizmo_id:TARGET})});
    window.labFetchConversation=()=>fetch(`/backend-api/conversation/${CURRENT}`).then(r=>r.json());
    document.getElementById('native-send').addEventListener('click',window.labSend);
    document.getElementById('lab-send-native').addEventListener('click',window.labSend);
    document.getElementById('lab-move-native').addEventListener('click',()=>window.labMove());
  </script>
</body>
</html>
